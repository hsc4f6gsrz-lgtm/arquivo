<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arquivo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arquivo">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="bar">
  <button id="back" class="hbtn" aria-label="Voltar" hidden>‹ <span>Voltar</span></button>
  <h1 id="title">Arquivo</h1>
  <button id="gear" class="hbtn right" aria-label="Definições">⚙︎</button>
</header>
<main id="view"></main>
<button id="fab" aria-label="Novo documento">＋</button>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="filIn" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp,.txt,.csv,.rtf,.jpg,.jpeg,.png,.heic,application/pdf" hidden>
<input type="file" id="carIn" accept="image/*" hidden>
<input type="file" id="impIn" accept=".zip,application/zip" hidden>
<div id="sheetWrap" hidden><div id="sheetBg"></div><div id="sheet"></div></div>
<div id="busy" hidden><div class="busybox"><div class="spin"></div><div id="busyTxt">A trabalhar…</div><div class="bar"><i id="busyBar"></i></div></div></div>
<div id="viewer" hidden><button id="vClose">✕</button><div id="vScroll"><img id="vImg" alt=""></div></div>
<div id="toast" hidden></div>
<div id="lock" hidden><div class="lk">
  <div class="lkicon">🔒</div><div id="lkMsg">Introduz o código</div><div id="lkSub"></div>
  <div id="dots"></div>
  <div class="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button id="lkBio" class="fx" hidden>Face ID</button><button data-k="0">0</button><button id="lkDel" class="fx">⌫</button>
  </div>
  <button id="lkCancel" class="lklink" hidden>Cancelar</button>
  <button id="lkForgot" class="lklink" hidden>Esqueci-me do código</button>
</div></div>
<script src="vendor/tesseract.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
